<script>SurveyApp.body("\n\n<div class=\"progress-wrapper\">\n    <span class=\"progress-text\">راهنمای سناریوها<\/span>\n    <div class=\"progress-container\">\n        <div class=\"progress-bar-fill\"><\/div>\n    <\/div>\n<\/div>\n\n<div class=\"intro-title\">\n    <h3><i class=\"fas fa-lightbulb me-2\" style=\"color: #fbbf24;\"><\/i>راهنمای سناریوها<\/h3>\n    <p>برای درک بهتر سناریوهای بعدی، لطفاً این توضیحات را مطالعه کنید.<\/p>\n<\/div>\n\n<\!-- بخش اول: دوچرخه برقی با دو عکس -->\n<div class=\"form-card\" style=\"border-right: 4px solid #10b981;\">\n    <div class=\"card-title-text\" style=\"color: #34d399 !important;\">\n        دوچرخه برقی\n    <\/div>\n\n    <p style=\"text-align: justify; margin-bottom: 12px;\">\n        در این پرسشنامه، منظور از <span class=\"highlight-text\">دوچرخه برقی<\/span>، دوچرخه پدال‌کمکی است؛ یعنی موتور فقط هنگام رکاب‌زدن به حرکت شما کمک می‌کند.\n    <\/p>\n\n    <div class=\"image-container\">\n        <img src=\"https://i.postimg.cc/PqSRKPRy/huanan1-jpeg.jpg\" alt=\"دوچرخه برقی ۱\" class=\"ebike-image-half\">\n        <img src=\"https://i.postimg.cc/50ZpkvqJ/dwchrkhh-brqy1.jpg\" alt=\"دوچرخه برقی ۲\" class=\"ebike-image-half\">\n    <\/div>\n<\/div>\n\n<\!-- بخش دوم: حمایت مالی (کارت جدید) -->\n<div class=\"form-card\" style=\"border-right: 4px solid #3b82f6;\">\n    <div class=\"card-title-text\" style=\"color: #60a5fa !important;\">\n        حمایت مالی (یارانه خرید)\n    <\/div>\n\n    <p style=\"text-align: justify; margin-bottom: 0;\">\n        <span class=\"highlight-text\">حمایت مالی<\/span> مبلغی تشویقی از طرف دولت یا شهرداری است که هنگام خرید، مستقیماً از قیمت دوچرخه برقی کسر می‌شود. قیمتی که در سناریوها می‌بینید، مبلغ نهایی پرداختی توسط شما (پس از کسر این حمایت) است.\n    <\/p>\n<\/div>\n\n<\!-- بخش سوم: سپرده بازگشت‌پذیر -->\n<div class=\"form-card\" style=\"border-right: 4px solid #f59e0b;\">\n    <div class=\"card-title-text\" style=\"color: #fbbf24 !important;\">\n        سپرده بازگشت‌پذیر\n    <\/div>\n\n    <p style=\"text-align: justify; margin-bottom: 0;\">\n        <span class=\"highlight-text\">سپرده بازگشت‌پذیر<\/span> مبلغی است که هنگام عضویت در سامانه دوچرخه اشتراکی، به‌طور موقت نگه داشته می‌شود و پس از پایان عضویت، طبق مقررات به شما بازگردانده می‌شود.\n    <\/p>\n<\/div>\n\n<button class=\"btn-next\" type=\"submit\">\n    شروع سناریوها\n    <i class=\"fas fa-arrow-left ms-2\" style=\"position: relative; top: 2px;\"><\/i>\n<\/button>\n\n");</script>
