    <script>SurveyApp.head("\n<link rel=\"stylesheet\" href=\"assets/vazirmatn/Vazirmatn-font-face.css\">\n<link rel=\"stylesheet\" href=\"assets/fontawesome/css/all.min.css\">\n\n<style>\n    body {\n        font-family: 'B Nazanin', 'Vazirmatn', Tahoma, sans-serif !important;\n        background-color: #0f172a;\n        direction: rtl;\n        text-align: right;\n        color: #cbd5e1;\n        font-size: 1.15rem;\n        line-height: 1.9;\n    }\n\n    h1, h2, h3, h4, h5, h6, .card-title-text, .progress-text, .col-form-label, .form-label {\n        font-family: 'B Titr', 'Vazirmatn', Tahoma, sans-serif !important;\n        font-weight: bold;\n        color: #f8fafc !important;\n    }\n\n    .otree-body {\n        max-width: 800px;\n        margin: 0 auto;\n    }\n\n    .page-header-default { display: none; }\n\n    .progress-wrapper {\n        margin-top: 15px;\n        margin-bottom: 25px;\n        text-align: left;\n    }\n    .progress-text {\n        font-size: 1.1rem;\n        color: #94a3b8 !important;\n        margin-bottom: 8px;\n        display: inline-block;\n    }\n    .progress-container {\n        width: 100%;\n        background-color: #1e293b;\n        border-radius: 10px;\n        height: 8px;\n        box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);\n    }\n    .progress-bar-fill {\n        height: 100%;\n        background: linear-gradient(90deg, #3b82f6, #0ea5e9);\n        width: 75%;\n        border-radius: 10px;\n        box-shadow: 0 0 10px rgba(14, 165, 233, 0.5);\n    }\n\n    .custom-header {\n        background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);\n        color: #f8fafc;\n        border-radius: 16px;\n        padding: 25px 30px;\n        margin-bottom: 30px;\n        box-shadow: 0 8px 20px rgba(0,0,0,0.4);\n        border: 1px solid #334155;\n        text-align: center;\n    }\n    \n    .custom-header h4 {\n        margin: 0;\n        font-size: 1.6rem;\n        color: #60a5fa !important;\n    }\n\n    /* --- استایل شیشه‌ای (Glassmorphism) برای باکس سؤالات --- */\n    .question-section {\n        background: rgba(30, 41, 59, 0.65); /* پس‌زمینه نیمه‌شفاف */\n        backdrop-filter: blur(12px); /* افکت مات و شیشه‌ای */\n        -webkit-backdrop-filter: blur(12px);\n        border: 1px solid rgba(255, 255, 255, 0.08); /* حاشیه بسیار محو */\n        border-radius: 16px;\n        padding: 30px;\n        margin-bottom: 25px;\n        transition: transform 0.3s ease, box-shadow 0.3s ease;\n    }\n\n    /* هاله‌های رنگی متفاوت برای هر سؤال */\n    .q9-box {\n        border-right: 4px solid #3b82f6;\n        box-shadow: 0 10px 30px rgba(59, 130, 246, 0.15);\n    }\n    .q10-box {\n        border-right: 4px solid #f59e0b;\n        box-shadow: 0 10px 30px rgba(245, 158, 11, 0.15);\n    }\n\n    .question-section:hover {\n        transform: translateY(-2px);\n    }\n    /* ---------------------------------------------------- */\n\n    .col-form-label {\n        font-size: 1.25rem;\n        margin-bottom: 20px;\n        display: flex;\n        align-items: flex-start;\n        gap: 12px;\n        line-height: 1.6;\n    }\n\n    .question-icon {\n        font-size: 1.6rem;\n        flex-shrink: 0;\n        margin-top: 2px;\n    }\n\n    .form-group {\n        margin-bottom: 0;\n    }\n\n    .form-check {\n        margin-bottom: 14px;\n        padding-right: 1.8rem;\n    }\n    \n    .form-check-label {\n        color: #cbd5e1 !important;\n        font-size: 1.1rem;\n        cursor: pointer;\n        line-height: 1.7;\n    }\n\n    .form-check-input {\n        cursor: pointer;\n        width: 1.3em;\n        height: 1.3em;\n        float: right;\n        margin-right: -1.8rem;\n        accent-color: #3b82f6;\n    }\n\n    .form-control, .form-select, textarea {\n        background-color: #0f172a !important;\n        color: #f8fafc !important;\n        border: 1px solid #475569 !important;\n        border-radius: 10px !important;\n        padding: 12px 15px !important;\n        font-family: 'Vazirmatn', sans-serif !important;\n        font-size: 1.05rem;\n        transition: all 0.3s ease;\n        width: 100%;\n    }\n\n    .form-control:focus, .form-select:focus, textarea:focus {\n        border-color: #3b82f6 !important;\n        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;\n        outline: none !important;\n    }\n\n    textarea {\n        resize: vertical;\n        min-height: 100px;\n    }\n\n    .btn-submit {\n        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);\n        color: white;\n        border: none;\n        border-radius: 50px;\n        padding: 15px 50px;\n        font-size: 1.3rem;\n        font-family: 'B Titr', 'Vazirmatn', sans-serif;\n        box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);\n        transition: all 0.3s ease;\n        display: block;\n        margin: 40px auto;\n        cursor: pointer;\n    }\n\n    .btn-submit:hover {\n        background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);\n        transform: translateY(-2px);\n        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.6);\n    }\n\n    #other-barrier-box {\n        display: none;\n        background-color: rgba(15, 23, 42, 0.5);\n        border-right: 3px solid #f59e0b;\n        padding: 20px;\n        border-radius: 8px;\n        margin-top: 20px;\n    }\n\n    .divider {\n        height: 1px;\n        background: linear-gradient(90deg, transparent, #334155, transparent);\n        margin: 30px 0;\n    }\n\n    @media (max-width: 768px) {\n        .otree-body { max-width: 100%; }\n        .question-section { padding: 25px 20px; }\n        .form-check-label { font-size: 1rem; }\n        .custom-header { padding: 20px 20px; }\n        .btn-submit { width: 90%; padding: 14px 30px; font-size: 1.15rem; }\n    }\n<\/style>\n");</script>

<script>SurveyApp.body("\n\n<div class=\"progress-wrapper\">\n    <span class=\"progress-text\">چند سؤال کوتاه<\/span>\n    <div class=\"progress-container\">\n        <div class=\"progress-bar-fill\"><\/div>\n    <\/div>\n<\/div>\n\n<div class=\"custom-header\">\n    <h4><i class=\"fas fa-comments me-2\"><\/i>چند سؤال کوتاه درباره انتخاب‌های شما<\/h4>\n<\/div>\n\n{% if show_q9 %}\n<div class=\"question-section q9-box\">\n    <div class=\"form-group\">\n        <label class=\"col-form-label\">\n            <i class=\"fas fa-exchange-alt question-icon\" style=\"color: #3b82f6;\"><\/i>\n            اگر از دوچرخه برقی شخصی یا اشتراکی استفاده کنید، این وسیله بیشتر جای کدام روش فعلی رفت‌وآمد شما را می‌گیرد؟\n        <\/label>\n        <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_q9_substitution\"><\/label>\n        <div class=\"controls\">\n            <div id=\"id_q9_substitution\"><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_q9_substitution-0\" name=\"q9_substitution\" value=\"1\"> <label for=\"id_q9_substitution-0\">خودروی شخصی ـ راننده<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_q9_substitution-1\" name=\"q9_substitution\" value=\"2\"> <label for=\"id_q9_substitution-1\">خودروی شخصی ـ سرنشین یا تاکسی<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_q9_substitution-2\" name=\"q9_substitution\" value=\"3\"> <label for=\"id_q9_substitution-2\">موتورسیکلت<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_q9_substitution-3\" name=\"q9_substitution\" value=\"4\"> <label for=\"id_q9_substitution-3\">حمل‌ونقل عمومی<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_q9_substitution-4\" name=\"q9_substitution\" value=\"5\"> <label for=\"id_q9_substitution-4\">پیاده‌روی<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_q9_substitution-5\" name=\"q9_substitution\" value=\"6\"> <label for=\"id_q9_substitution-5\">دوچرخه معمولی<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_q9_substitution-6\" name=\"q9_substitution\" value=\"7\"> <label for=\"id_q9_substitution-6\">این سفر جدید است و جای روش دیگری را نمی‌گیرد<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_q9_substitution-7\" name=\"q9_substitution\" value=\"8\"> <label for=\"id_q9_substitution-7\">مطمئن نیستم<\/label><\/div><\/div>\n        <\/div>\n    \n    \n    \n<\/div>\n    <\/div>\n<\/div>\n<div class=\"divider\"><\/div>\n{% endif %}\n\n<div class=\"question-section q10-box\">\n    <div class=\"form-group\">\n        <label class=\"col-form-label\">\n            <i class=\"fas fa-exclamation-triangle question-icon\" style=\"color: #f59e0b;\"><\/i>\n            <div>\n                مهم‌ترین موانع شما برای استفاده منظم از دوچرخه برقی چیست؟\n                <span style=\"font-size: 0.95rem; color: #94a3b8; font-weight: normal; margin-right: 5px;\">(می‌توانید چند گزینه را انتخاب کنید)<\/span>\n            <\/div>\n        <\/label>\n        \n        <div class=\"checkbox-group\">\n            <div class=\"form-check\">\n                <input class=\"form-check-input q10-check\" type=\"checkbox\" value=\"1\" id=\"q10_1\">\n                <label class=\"form-check-label\" for=\"q10_1\">ایمنی مسیر<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input q10-check\" type=\"checkbox\" value=\"2\" id=\"q10_2\">\n                <label class=\"form-check-label\" for=\"q10_2\">قیمت خرید دوچرخه برقی<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input q10-check\" type=\"checkbox\" value=\"3\" id=\"q10_3\">\n                <label class=\"form-check-label\" for=\"q10_3\">کرایه دوچرخه برقی اشتراکی<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input q10-check\" type=\"checkbox\" value=\"4\" id=\"q10_4\">\n                <label class=\"form-check-label\" for=\"q10_4\">در دسترس نبودن دوچرخه اشتراکی<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input q10-check\" type=\"checkbox\" value=\"5\" id=\"q10_5\">\n                <label class=\"form-check-label\" for=\"q10_5\">نگرانی از سرقت یا نبود پارک امن<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input q10-check\" type=\"checkbox\" value=\"6\" id=\"q10_6\">\n                <label class=\"form-check-label\" for=\"q10_6\">سختی استفاده یا شرایط آب‌وهوا<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input q10-check\" type=\"checkbox\" value=\"7\" id=\"q10_7\">\n                <label class=\"form-check-label\" for=\"q10_7\">مشکل اپلیکیشن یا پرداخت آنلاین<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input q10-check\" type=\"checkbox\" value=\"8\" id=\"q10_8\">\n                <label class=\"form-check-label\" for=\"q10_8\">نیازی به استفاده از دوچرخه برقی ندارم<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input q10-check\" type=\"checkbox\" value=\"9\" id=\"q10_9\">\n                <label class=\"form-check-label\" for=\"q10_9\">مورد دیگر<\/label>\n            <\/div>\n        <\/div>\n        \n        <input type=\"hidden\" name=\"q10_barrier\" id=\"q10_barrier\" value=\"\">\n    <\/div>\n\n    <div id=\"other-barrier-box\">\n        <label class=\"col-form-label\" style=\"font-size: 1.1rem; margin-bottom: 10px;\">\n            لطفاً مهم‌ترین مانع دیگر را کوتاه بنویسید:\n        <\/label>\n        <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_q10_other\"><\/label>\n        <div class=\"controls\">\n            <input type=\"text\" class=\"form-control\" id=\"id_q10_other\" name=\"q10_other\" value=\"\">\n        <\/div>\n    \n    \n    \n<\/div>\n    <\/div>\n<\/div>\n\n<button class=\"btn-submit\" type=\"submit\">تکمیل و ادامه <i class=\"fas fa-arrow-left ms-2\" style=\"position: relative; top: 2px;\"><\/i><\/button>\n\n");</script>
<script>SurveyApp.afterBody();</script>
<script src="assets/bootstrap5/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // مدیریت انتخاب‌ها برای سؤال ۱۰ (تبدیل چک‌باکس‌ها به رشته و کنترل فیلد 'مورد دیگر')
        const checkBoxes = document.querySelectorAll('.q10-check');
        const hiddenInput = document.getElementById('q10_barrier');
        const otherBox = document.getElementById('other-barrier-box');
        
        function updateQ10Selection() {
            let selected = [];
            let isOtherChecked = false;
            
            document.querySelectorAll('.q10-check:checked').forEach(cb => {
                selected.push(cb.value);
                if (cb.value === "9") {
                    isOtherChecked = true;
                }
            });
            
            // ذخیره مقادیر انتخاب‌شده در فیلد پنهان (به فرمت 1,4,5)
            hiddenInput.value = selected.join(',');
            
            // نمایش کادر مورد دیگر
            if (otherBox) {
                otherBox.style.display = isOtherChecked ? 'block' : 'none';
            }
            
            // اجباری کردن فیلد متنی مورد دیگر
            const otherInput = document.querySelector('textarea[name="q10_other"]') || document.querySelector('input[name="q10_other"]');
            if (otherInput) {
                otherInput.required = isOtherChecked;
            }
        }
        
        checkBoxes.forEach(cb => cb.addEventListener('change', updateQ10Selection));
        updateQ10Selection(); // بررسی وضعیت اولیه
    });
</script>
</body>
</html>
