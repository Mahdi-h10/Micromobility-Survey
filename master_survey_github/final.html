    <script>SurveyApp.init("FinalPage");</script>
    <script>SurveyApp.head("\n<link rel=\"stylesheet\" href=\"assets/vazirmatn/Vazirmatn-font-face.css\">\n<link rel=\"stylesheet\" href=\"assets/fontawesome/css/all.min.css\">\n\n<style>\n    /* --- تنظیمات پایه --- */\n    body {\n        font-family: 'B Nazanin', 'Vazirmatn', Tahoma, sans-serif !important;\n        background-color: #0f172a;\n        direction: rtl;\n        text-align: right;\n        color: #cbd5e1;\n        font-size: 1.15rem;\n        line-height: 1.9;\n        margin: 0;\n        padding: 0;\n        min-height: 100vh;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        overflow: hidden;\n    }\n\n    h1, h2, h3, h4, h5, h6 {\n        font-family: 'B Titr', 'Vazirmatn', Tahoma, sans-serif !important;\n        font-weight: normal;\n        color: #f8fafc !important;\n    }\n\n    .otree-body {\n        max-width: 800px;\n        width: 100%;\n        margin: 0 auto;\n        padding: 20px;\n        position: relative;\n        z-index: 10;\n    }\n\n    .page-header-default { display: none; }\n\n    /* --- پس‌زمینه متحرک (گوی‌های درخشان) --- */\n    .glow-bg {\n        position: absolute;\n        border-radius: 50%;\n        filter: blur(80px);\n        opacity: 0.4;\n        z-index: -1;\n        animation: floatOrb 8s infinite alternate ease-in-out;\n    }\n    .glow-1 {\n        width: 300px; height: 300px;\n        background: #10b981; /* سبز */\n        top: -100px; right: -50px;\n    }\n    .glow-2 {\n        width: 250px; height: 250px;\n        background: #3b82f6; /* آبی */\n        bottom: -100px; left: -50px;\n        animation-delay: -4s;\n    }\n\n    @keyframes floatOrb {\n        0% { transform: translateY(0) scale(1); opacity: 0.3; }\n        100% { transform: translateY(40px) scale(1.1); opacity: 0.6; }\n    }\n\n    /* --- کارت شیشه‌ای اصلی --- */\n    .final-box {\n        background: rgba(15, 23, 42, 0.55);\n        backdrop-filter: blur(20px);\n        -webkit-backdrop-filter: blur(20px);\n        border: 1px solid rgba(255, 255, 255, 0.1);\n        border-top: 1px solid rgba(255, 255, 255, 0.2);\n        border-radius: 24px;\n        padding: 60px 40px;\n        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.05);\n        text-align: center;\n        position: relative;\n        opacity: 0;\n        transform: translateY(30px);\n        animation: fadeUpBox 0.8s ease forwards;\n    }\n\n    @keyframes fadeUpBox {\n        to { opacity: 1; transform: translateY(0); }\n    }\n\n    /* --- انیمیشن دوچرخه (رسیدن به پایان مسیر) --- */\n    .journey-end {\n        position: relative;\n        height: 60px;\n        margin-bottom: 30px;\n        overflow: hidden;\n    }\n    \n    .bike-anim {\n        position: absolute;\n        top: 0;\n        right: -50px;\n        font-size: 2.2rem;\n        color: #10b981;\n        filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6));\n        animation: rideBike 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;\n    }\n\n    .road-line {\n        position: absolute;\n        bottom: 10px;\n        left: 5%;\n        right: 5%;\n        height: 2px;\n        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);\n    }\n\n    @keyframes rideBike {\n        0% { right: -50px; opacity: 0; transform: rotate(10deg); }\n        15% { opacity: 1; transform: rotate(0deg); }\n        80% { opacity: 1; }\n        100% { right: 50%; transform: translateX(50%); opacity: 0; }\n    }\n\n    /* --- آیکون تیک سبز (ظهور پس از دوچرخه) --- */\n    .final-icon {\n        width: 90px;\n        height: 90px;\n        border-radius: 50%;\n        display: inline-flex;\n        align-items: center;\n        justify-content: center;\n        background: linear-gradient(135deg, #10b981, #059669);\n        color: white;\n        font-size: 3rem;\n        margin-bottom: 25px;\n        box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);\n        position: relative;\n        opacity: 0;\n        transform: scale(0);\n        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.6s forwards;\n    }\n\n    /* موج پالس دور تیک */\n    .final-icon::before {\n        content: '';\n        position: absolute;\n        top: -15px; left: -15px; right: -15px; bottom: -15px;\n        border-radius: 50%;\n        border: 2px solid #10b981;\n        opacity: 0;\n        animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) 2s infinite;\n    }\n\n    @keyframes popIn {\n        to { opacity: 1; transform: scale(1); }\n    }\n\n    @keyframes pulseRing {\n        0% { transform: scale(0.8); opacity: 0.8; }\n        100% { transform: scale(1.5); opacity: 0; }\n    }\n\n    /* --- تایپوگرافی و ظاهر متن --- */\n    .final-title {\n        font-size: 2.2rem;\n        margin-bottom: 20px;\n        background: linear-gradient(135deg, #34d399, #10b981);\n        -webkit-background-clip: text;\n        -webkit-text-fill-color: transparent;\n        opacity: 0;\n        transform: translateY(15px);\n        animation: fadeInUpText 0.6s ease 1.9s forwards;\n    }\n\n    .final-text {\n        max-width: 650px;\n        margin: 0 auto;\n        color: #e2e8f0;\n        font-size: 1.25rem;\n        line-height: 1.8;\n        opacity: 0;\n        transform: translateY(15px);\n        animation: fadeInUpText 0.6s ease 2.1s forwards;\n    }\n\n    .final-note {\n        color: #94a3b8;\n        font-size: 1.05rem;\n        margin-top: 15px;\n        opacity: 0;\n        transform: translateY(15px);\n        animation: fadeInUpText 0.6s ease 2.3s forwards;\n    }\n\n    @keyframes fadeInUpText {\n        to { opacity: 1; transform: translateY(0); }\n    }\n\n    @media (max-width: 768px) {\n        .final-box { padding: 40px 25px; }\n        .final-title { font-size: 1.8rem; }\n        .final-text { font-size: 1.1rem; }\n        .glow-bg { display: none; /* در موبایل برای عملکرد بهتر غیرفعال می‌شود */ }\n    }\n<\/style>\n");</script>
</head>

<script>SurveyApp.body("\n\n<\!-- گوی‌های درخشان پس‌زمینه -->\n<div class=\"glow-bg glow-1\"><\/div>\n<div class=\"glow-bg glow-2\"><\/div>\n\n<div class=\"final-box\">\n    \n    <\!-- انیمیشن پایان مسیر (دوچرخه‌ای که رد می‌شود) -->\n    <div class=\"journey-end\">\n        <i class=\"fas fa-bicycle bike-anim\"><\/i>\n        <div class=\"road-line\"><\/div>\n    <\/div>\n\n    <\!-- آیکون موفقیت -->\n    <div class=\"final-icon\">\n        <i class=\"fas fa-check\"><\/i>\n    <\/div>\n\n    <\!-- متون پایانی -->\n    <h2 class=\"final-title\">از مشارکت شما سپاسگزاریم<\/h2>\n\n    <p class=\"final-text\">\n        از زمانی که برای پاسخ‌گویی به این پرسشنامه اختصاص دادید، صمیمانه سپاسگزاریم.\n    <\/p>\n\n    <p class=\"final-note\">\n        پاسخ‌های شما بدون نام و فقط به‌صورت آماری و گروهی تحلیل خواهند شد.\n    <\/p>\n<\/div>\n\n");</script>
