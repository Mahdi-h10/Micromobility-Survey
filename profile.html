    <script>SurveyApp.head("\n<link rel=\"stylesheet\" href=\"assets/vazirmatn/Vazirmatn-font-face.css\">\n<link rel=\"stylesheet\" href=\"assets/fontawesome/css/all.min.css\">\n\n<style>\n    /* تنظیمات پایه و تم شیشه‌ای */\n    body {\n        font-family: 'B Nazanin', 'Vazirmatn', Tahoma, sans-serif !important;\n        background-color: #0f172a;\n        direction: rtl;\n        text-align: right;\n        color: #cbd5e1;\n        font-size: 1.15rem;\n        line-height: 1.9;\n        background: radial-gradient(circle at top left, #1e3a8a 0%, #0f172a 40%, #0f172a 100%);\n        background-attachment: fixed;\n    }\n\n    h1, h2, h3, h4, h5, h6, .card-title-text, .progress-text, .col-form-label, .form-label {\n        font-family: 'B Titr', 'Vazirmatn', Tahoma, sans-serif !important;\n        font-weight: normal;\n        color: #f8fafc !important;\n    }\n\n    .otree-body {\n        max-width: 800px;\n        margin: 0 auto;\n    }\n\n    .page-header-default { display: none; }\n\n    /* --- نوار پیشرفت پایانی --- */\n    .progress-wrapper {\n        margin-top: 15px;\n        margin-bottom: 25px;\n        text-align: left;\n    }\n    .progress-text {\n        font-size: 1.1rem;\n        color: #94a3b8 !important;\n        margin-bottom: 8px;\n        display: inline-block;\n    }\n    .progress-container {\n        width: 100%;\n        background-color: rgba(30, 41, 59, 0.8);\n        border-radius: 10px;\n        height: 8px;\n        box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);\n    }\n    .progress-bar-fill {\n        height: 100%;\n        background: linear-gradient(90deg, #10b981, #059669);\n        width: 100%;\n        border-radius: 10px;\n        box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);\n    }\n\n    /* --- هدر اختصاصی صفحه پایانی --- */\n    .custom-header {\n        background: rgba(15, 23, 42, 0.6);\n        backdrop-filter: blur(10px);\n        -webkit-backdrop-filter: blur(10px);\n        color: #f8fafc;\n        border-radius: 16px;\n        padding: 25px 30px;\n        margin-bottom: 30px;\n        box-shadow: 0 8px 25px rgba(0,0,0,0.3);\n        border: 1px solid rgba(255, 255, 255, 0.05);\n        text-align: center;\n    }\n    \n    .custom-header h4 {\n        margin: 0;\n        font-size: 1.8rem;\n        color: #10b981 !important;\n        text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);\n    }\n\n    /* --- افکت شیشه‌ای برای کادرهای فرم --- */\n    .glass-card {\n        background: rgba(30, 41, 59, 0.45);\n        backdrop-filter: blur(16px);\n        -webkit-backdrop-filter: blur(16px);\n        border: 1px solid rgba(255, 255, 255, 0.08);\n        border-radius: 16px;\n        padding: 35px 30px;\n        margin-bottom: 25px;\n        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);\n        transition: transform 0.3s ease, box-shadow 0.3s ease;\n        position: relative;\n        overflow: hidden;\n    }\n\n    .glass-card:hover {\n        transform: translateY(-3px);\n        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);\n    }\n\n    .question-divider {\n        border-top: 1px dashed rgba(255, 255, 255, 0.15);\n        margin: 25px 0;\n    }\n\n    .form-group {\n        margin-bottom: 0;\n    }\n    \n    .col-form-label {\n        font-size: 1.25rem;\n        margin-bottom: 15px;\n        display: block;\n    }\n\n    /* کادرهای متنی و ورودی‌های عددی (مثل سن) */\n    .form-control, input[type=\"number\"] {\n        background-color: rgba(15, 23, 42, 0.6) !important;\n        color: #f8fafc !important;\n        border: 1px solid rgba(255, 255, 255, 0.1) !important;\n        border-radius: 12px !important;\n        padding: 14px 18px !important;\n        font-family: 'Vazirmatn', sans-serif !important;\n        font-size: 1.15rem;\n        transition: all 0.3s ease;\n        width: 100%;\n        max-width: 250px;\n        text-align: center;\n    }\n\n    .form-control:focus, input[type=\"number\"]:focus {\n        border-color: #10b981 !important;\n        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25) !important;\n        outline: none !important;\n        background-color: rgba(15, 23, 42, 0.9) !important;\n    }\n\n    /* --- تبدیل کامل و اختصاصی رادیوباتن‌های پیش‌فرض oTree --- */\n    .controls .form-check {\n        background: rgba(15, 23, 42, 0.4);\n        border: 1px solid rgba(255, 255, 255, 0.06);\n        border-radius: 12px;\n        padding: 14px 18px !important;\n        margin-bottom: 12px;\n        transition: all 0.3s ease;\n        display: flex;\n        align-items: center;\n        cursor: pointer;\n        user-select: none;\n    }\n\n    .controls .form-check:hover {\n        background: rgba(51, 65, 85, 0.8);\n        border-color: rgba(148, 163, 184, 0.5);\n    }\n\n    /* استایل اختصاصی هنگام انتخاب شدن */\n    .controls .form-check:has(input:checked) {\n        background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.15));\n        border-color: #10b981;\n        box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);\n    }\n\n    /* لغو کدهای مخرب بوت‌استرپ برای جلوگیری از روی هم افتادن دایره و متن */\n    .controls .form-check-input {\n        position: relative !important;\n        margin: 0 0 0 15px !important; /* فاصله از متن */\n        width: 24px !important;\n        height: 24px !important;\n        appearance: none;\n        -webkit-appearance: none;\n        border: 2px solid #64748b;\n        border-radius: 50%;\n        background-color: transparent;\n        flex-shrink: 0;\n        cursor: pointer;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        outline: none;\n    }\n\n    .controls .form-check-input:checked {\n        border-color: #10b981;\n    }\n\n    .controls .form-check-input:checked::after {\n        content: '';\n        width: 12px;\n        height: 12px;\n        background-color: #10b981;\n        border-radius: 50%;\n        display: block;\n        transition: all 0.2s ease;\n    }\n\n    .controls .form-check-label {\n        color: #cbd5e1 !important;\n        font-size: 1.15rem;\n        cursor: pointer;\n        flex-grow: 1;\n        margin: 0 !important;\n        padding: 0 !important;\n        line-height: 1.5;\n        transition: color 0.3s ease;\n        text-align: right;\n    }\n\n    .controls .form-check:has(input:checked) .form-check-label {\n        color: #ffffff !important;\n        font-weight: bold;\n    }\n\n    /* --- دکمه ثبت نهایی پاسخ‌ها --- */\n    .btn-submit {\n        background: linear-gradient(135deg, #10b981 0%, #059669 100%);\n        color: white;\n        border: none;\n        border-radius: 50px;\n        padding: 15px 50px;\n        font-size: 1.4rem;\n        font-family: 'B Titr', 'Vazirmatn', sans-serif;\n        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);\n        transition: all 0.3s ease;\n        display: block;\n        width: 100%;\n        max-width: 400px;\n        margin: 35px auto 50px auto;\n        cursor: pointer;\n        text-align: center;\n    }\n\n    .btn-submit:hover {\n        background: linear-gradient(135deg, #34d399 0%, #10b981 100%);\n        transform: translateY(-2px);\n        box-shadow: 0 12px 25px rgba(16, 185, 129, 0.6);\n        color: white;\n    }\n\n    @media (max-width: 768px) {\n        .custom-header { padding: 20px; }\n        .glass-card { padding: 25px 20px; }\n        .btn-submit { max-width: 90%; font-size: 1.25rem; }\n        .form-control, input[type=\"number\"] { max-width: 100%; }\n        .custom-header h4 { font-size: 1.5rem; }\n    }\n<\/style>\n");</script>

<script>SurveyApp.body("\n\n<div class=\"progress-wrapper\">\n    <span class=\"progress-text\">مرحله پایانی (۱۰۰٪)<\/span>\n    <div class=\"progress-container\">\n        <div class=\"progress-bar-fill\"><\/div>\n    <\/div>\n<\/div>\n\n<div class=\"custom-header\">\n    <h4><i class=\"fas fa-id-card me-2\"><\/i> مشخصات پایانی<\/h4>\n    <p class=\"mb-0 mt-3\" style=\"color: #cbd5e1; font-size: 1.1rem; line-height: 1.8;\">\n        در پایان، لطفاً به چند سؤال کوتاه پاسخ دهید. این اطلاعات فقط برای تحلیل آماری تفاوت میان گروه‌های مختلف استفاده می‌شود و پاسخ‌های شما به‌صورت ناشناس باقی می‌ماند.\n    <\/p>\n<\/div>\n\n<\!-- کادر اول (سن و جنسیت) -->\n<div class=\"glass-card\" style=\"border-right: 4px solid #3b82f6;\">\n    <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_age\">سن شما چند سال است؟<\/label>\n        <div class=\"controls\">\n            <input type=\"number\" class=\"form-control\" inputmode=\"numeric\" id=\"id_age\" max=\"110\" min=\"15\" name=\"age\" required=\"\" value=\"\">\n        <\/div>\n    \n    \n    \n<\/div>\n    \n    <div class=\"question-divider\"><\/div>\n\n    <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_gender\">جنسیت شما چیست؟<\/label>\n        <div class=\"controls\">\n            <div id=\"id_gender\" required=\"\"><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_gender-0\" name=\"gender\" required=\"\" value=\"1\"> <label for=\"id_gender-0\">زن<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_gender-1\" name=\"gender\" required=\"\" value=\"2\"> <label for=\"id_gender-1\">مرد<\/label><\/div><\/div>\n        <\/div>\n    \n    \n    \n<\/div>\n<\/div>\n\n<\!-- کادر دوم (تحصیلات و محدودیت‌ها) -->\n<div class=\"glass-card\" style=\"border-right: 4px solid #f59e0b;\">\n    <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_education\">بالاترین مدرک تحصیلی شما چیست؟<\/label>\n        <div class=\"controls\">\n            <div id=\"id_education\" required=\"\"><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_education-0\" name=\"education\" required=\"\" value=\"1\"> <label for=\"id_education-0\">کمتر از دیپلم<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_education-1\" name=\"education\" required=\"\" value=\"2\"> <label for=\"id_education-1\">دیپلم یا کاردانی<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_education-2\" name=\"education\" required=\"\" value=\"3\"> <label for=\"id_education-2\">کارشناسی<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_education-3\" name=\"education\" required=\"\" value=\"4\"> <label for=\"id_education-3\">کارشناسی ارشد یا بالاتر<\/label><\/div><\/div>\n        <\/div>\n    \n    \n    \n<\/div>\n    \n    <div class=\"question-divider\"><\/div>\n    \n    <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_income_adequacy\">درآمد خانوار شما در مقایسه با هزینه‌های ضروری ماهانه چگونه است؟<\/label>\n        <div class=\"controls\">\n            <div id=\"id_income_adequacy\" required=\"\"><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_income_adequacy-0\" name=\"income_adequacy\" required=\"\" value=\"1\"> <label for=\"id_income_adequacy-0\">خیلی کمتر<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_income_adequacy-1\" name=\"income_adequacy\" required=\"\" value=\"2\"> <label for=\"id_income_adequacy-1\">کمتر<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_income_adequacy-2\" name=\"income_adequacy\" required=\"\" value=\"3\"> <label for=\"id_income_adequacy-2\">تقریباً برابر<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_income_adequacy-3\" name=\"income_adequacy\" required=\"\" value=\"4\"> <label for=\"id_income_adequacy-3\">بیشتر<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_income_adequacy-4\" name=\"income_adequacy\" required=\"\" value=\"5\"> <label for=\"id_income_adequacy-4\">خیلی بیشتر<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_income_adequacy-5\" name=\"income_adequacy\" required=\"\" value=\"6\"> <label for=\"id_income_adequacy-5\">ترجیح می‌دهم پاسخ ندهم<\/label><\/div><\/div>\n        <\/div>\n    \n    \n    \n<\/div>\n    \n    <div class=\"question-divider\"><\/div>\n    \n    <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_mobility_limitation\">آیا در راه‌رفتن یا بالا رفتن از پله‌ها دشواری دارید؟<\/label>\n        <div class=\"controls\">\n            <div id=\"id_mobility_limitation\" required=\"\"><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_mobility_limitation-0\" name=\"mobility_limitation\" required=\"\" value=\"1\"> <label for=\"id_mobility_limitation-0\">خیر<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_mobility_limitation-1\" name=\"mobility_limitation\" required=\"\" value=\"2\"> <label for=\"id_mobility_limitation-1\">کمی دشواری<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_mobility_limitation-2\" name=\"mobility_limitation\" required=\"\" value=\"3\"> <label for=\"id_mobility_limitation-2\">دشواری زیادی<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_mobility_limitation-3\" name=\"mobility_limitation\" required=\"\" value=\"4\"> <label for=\"id_mobility_limitation-3\">اصلاً نمی‌توانم<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_mobility_limitation-4\" name=\"mobility_limitation\" required=\"\" value=\"5\"> <label for=\"id_mobility_limitation-4\">ترجیح می‌دهم پاسخ ندهم<\/label><\/div><\/div>\n        <\/div>\n    \n    \n    \n<\/div>\n<\/div>\n\n<button class=\"btn-submit\" type=\"submit\">ثبت نهایی پاسخ‌ها <i class=\"fas fa-check-circle ms-2\" style=\"position: relative; top: 2px;\"><\/i><\/button>\n\n");</script>
<script>SurveyApp.afterBody();</script>
<script src="assets/bootstrap5/js/bootstrap.bundle.min.js"></script>
<script>
    // با این اسکریپت کاربر با کلیک روی هر جای کادر (نه فقط متن یا دایره) می‌تواند گزینه را انتخاب کند
    document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll('.form-check').forEach(function(card) {
            card.addEventListener('click', function(e) {
                // جلوگیری از کلیک‌های تکراری اگر خود دایره یا متن لمس شده باشد
                if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL') {
                    const input = this.querySelector('input[type="radio"]');
                    if(input && !input.checked) {
                        input.checked = true;
                        // تحریک رویداد change برای سازگاری کامل با oTree
                        input.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                }
            });
        });
    });
</script>
