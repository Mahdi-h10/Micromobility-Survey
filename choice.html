<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/bootstrap5/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/otree/theme2.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>SurveyApp.init("ChoiceTask");</script>
    <script>SurveyApp.head("\n<link rel=\"stylesheet\" href=\"assets/vazirmatn/Vazirmatn-font-face.css\">\n<link rel=\"stylesheet\" href=\"assets/fontawesome/css/all.min.css\">\n\n<style>\n    body {\n        font-family: 'B Nazanin', 'Vazirmatn', Tahoma, sans-serif !important;\n        background-color: #0f172a;\n        direction: rtl;\n        text-align: right;\n        color: #cbd5e1;\n        font-size: 1.15rem;\n        line-height: 1.9;\n    }\n\n    h1, h2, h3, h4, h5, h6, .opt-title, .progress-text {\n        font-family: 'B Titr', 'Vazirmatn', Tahoma, sans-serif !important;\n        font-weight: bold;\n        color: #f8fafc !important;\n    }\n\n    .otree-body { max-width: 1100px; margin: 0 auto; }\n    .page-header-default { display: none; }\n\n    /* نوار پیشرفت */\n    .progress-wrapper { margin-top: 15px; margin-bottom: 35px; text-align: left; }\n    .progress-text { font-size: 1.1rem; color: #94a3b8 !important; margin-bottom: 12px; display: inline-block; }\n    \n    .progress-container { \n        width: 100%; \n        background-color: #1e293b; \n        border-radius: 10px; \n        height: 8px; \n        box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); \n        position: relative;\n    }\n    .progress-bar-fill {\n        height: 100%;\n        background: linear-gradient(90deg, #8b5cf6, #d946ef);\n        width: {{ progress_pct }}%;\n        border-radius: 10px;\n        transition: width 0.5s ease;\n        box-shadow: 0 0 10px rgba(217, 70, 239, 0.5);\n        position: relative;\n    }\n\n    /* دوچرخه متحرک روی نوار */\n    .progress-bike {\n        position: absolute;\n        left: -12px;\n        top: -24px;\n        font-size: 1.6rem;\n        color: #d946ef;\n        transform: scaleX(-1);\n        z-index: 10;\n        text-shadow: 2px 2px 5px rgba(0,0,0,0.5);\n    }\n\n    /* باکس توضیحات شیک و مدرن */\n    .scenario-context {\n        background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));\n        border-right: 4px solid #8b5cf6;\n        border-radius: 16px;\n        padding: 25px;\n        margin-bottom: 25px;\n        text-align: right;\n        color: #e2e8f0;\n        font-size: 1.15rem;\n        box-shadow: 0 8px 25px rgba(0,0,0,0.25);\n        line-height: 1.8;\n        display: flex;\n        align-items: flex-start;\n        gap: 15px;\n    }\n\n    .scenario-icon {\n        color: #8b5cf6;\n        font-size: 1.8rem;\n        margin-top: 5px;\n    }\n\n    .scenario-context strong {\n        color: #fbbf24;\n        font-weight: normal;\n    }\n\n    /* ── راهنمای اسکرول برای موبایل ───────────── */\n    .scroll-hint {\n        display: none;\n        text-align: center;\n        color: #94a3b8;\n        font-size: .9rem;\n        margin-bottom: 10px;\n    }\n\n    /* ── جدول مقایسه‌ای ───────────── */\n    .compare-wrap {\n        overflow-x: auto;\n        -webkit-overflow-scrolling: touch;\n        margin-top: 10px;\n    }\n    .compare-table {\n        width: 100%;\n        min-width: 680px;\n        border-collapse: separate;\n        border-spacing: 8px 0;\n    }\n    .compare-table th, .compare-table td {\n        padding: 18px 14px;\n        text-align: center;\n        vertical-align: middle;\n        background: #1e293b;\n        border-bottom: 1px solid #2c3a5a;\n        font-weight: normal;\n    }\n    .compare-table tr:last-of-type td { border-bottom: none; }\n\n    .row-label {\n        position: sticky;\n        right: 0;\n        z-index: 3;\n        background: #0f172a !important;\n        text-align: right;\n        color: #94a3b8;\n        font-size: .95rem;\n        min-width: 160px;\n        border-bottom: none !important;\n    }\n\n    .opt-head {\n        cursor: pointer;\n        color: #fff;\n        font-size: 1.1rem;\n        border-radius: 14px 14px 0 0;\n        transition: filter .2s ease, box-shadow .2s ease;\n    }\n    .opt-head i { display: block; font-size: 1.8rem; margin-bottom: 6px; opacity: .9; }\n    .opt-head[data-col=\"1\"] { background: linear-gradient(135deg, #475569, #334155); }\n    .opt-head[data-col=\"2\"] { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }\n    .opt-head[data-col=\"3\"] { background: linear-gradient(135deg, #0ea5e9, #0284c7); }\n    .opt-head:hover { filter: brightness(1.12); }\n    .opt-head.col-selected { box-shadow: inset 0 0 0 3px #10b981; }\n\n    tbody td[data-col] {\n        cursor: pointer;\n        color: #f8fafc;\n        font-size: 1.02rem;\n        transition: background .2s ease, box-shadow .2s ease;\n    }\n    tbody td[data-col]:hover { background: #25324d; }\n    td.col-selected { background: rgba(16, 185, 129, .12); box-shadow: inset 3px 0 0 #10b981, inset -3px 0 0 #10b981; }\n\n    tfoot td { background: #0f172a; padding: 14px; }\n    tfoot td[data-col] { border-radius: 0 0 14px 14px; }\n    \n    .select-pill {\n        display: flex; align-items: center; justify-content: center; gap: 8px;\n        width: 100%; padding: 12px; border-radius: 50px;\n        background: #1e293b; color: #94a3b8; cursor: pointer;\n        border: 1px solid #334155; transition: all .2s ease;\n    }\n    .select-pill input { display: none; }\n    .select-pill:hover { border-color: #475569; color: #cbd5e1; }\n    td.col-selected .select-pill { background: #10b981; color: #fff; border-color: #10b981; }\n\n    /* دکمه‌های رادیویی سفارشی در فوتر جدول */\n    .custom-radio {\n        display: inline-block;\n        width: 22px;\n        height: 22px;\n        border: 2px solid #94a3b8;\n        border-radius: 50%;\n        position: relative;\n        transition: all 0.2s ease;\n        background-color: transparent;\n    }\n    td.col-selected .custom-radio {\n        border-color: #fff;\n        background-color: #fff;\n        box-shadow: inset 0 0 0 5px #10b981;\n    }\n\n    .btn-submit {\n        background: linear-gradient(135deg, #3b82f6, #2563eb);\n        color: white;\n        border: none;\n        border-radius: 50px;\n        padding: 15px 50px;\n        font-size: 1.4rem;\n        font-family: 'Vazirmatn', sans-serif;\n        font-weight: bold;\n        display: block;\n        margin: 40px auto;\n        cursor: pointer;\n        opacity: 0.4;\n        transition: all 0.3s ease;\n        pointer-events: none;\n        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);\n    }\n    .btn-submit.active { opacity: 1; pointer-events: auto; }\n    .btn-submit.active:hover {\n        transform: translateY(-2px);\n        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.6);\n    }\n\n    .highlight-value {\n        font-weight: bold;\n        color: #fbbf24;\n        display: block;\n        font-size: 1.15rem;\n    }\n    .detail-line {\n        font-size: 0.85rem;\n        color: #94a3b8;\n        font-weight: normal;\n        margin-top: 6px;\n        display: block;\n    }\n\n    .deposit-note {\n        font-size: 0.85rem;\n        color: #cbd5e1;\n        font-weight: normal;\n        margin-top: 6px;\n        display: block;\n    }\n\n    @media (max-width: 768px) {\n        .scroll-hint { display: block; }\n        .compare-table { min-width: 580px; border-spacing: 6px 0; }\n        .compare-table th, .compare-table td { padding: 12px 8px; font-size: .92rem; }\n        .row-label { min-width: 108px; font-size: .8rem; }\n        .opt-head i { font-size: 1.4rem; }\n        .scenario-context { flex-direction: column; text-align: right; padding: 15px; }\n        .btn-submit { width: 90%; padding: 14px 30px; font-size: 1.2rem; }\n    }\n<\/style>\n");</script>
</head>

<script>SurveyApp.body("\n\n<div class=\"progress-wrapper\">\n    <span class=\"progress-text\">سناریوها<\/span>\n    <div class=\"progress-container\">\n        <div class=\"progress-bar-fill\">\n            <i class=\"fas fa-bicycle progress-bike\"><\/i>\n        <\/div>\n    <\/div>\n<\/div>\n\n{% if round_num == 1 %}\n<\!-- توضیحات کامل فقط در سناریوی اول نمایش داده می‌شود -->\n<div class=\"scenario-context\">\n    <i class=\"fas fa-lightbulb scenario-icon\"><\/i>\n    <div>\n        فرض کنید شرایط زیر برای <strong>۱۲ ماه آینده<\/strong> و برای همان سفر معمول کار یا تحصیل شما برقرار باشد. هوا معمولی است و سفر اضطراری نیست.<br>\n        با توجه به زمان، هزینه و شرایط واقعی زندگی خود، کدام برنامه را واقعاً برای بیشتر رفت‌وآمدهای این سفر انتخاب می‌کنید؟\n    <\/div>\n<\/div>\n{% else %}\n<div class=\"scenario-context\" style=\"display: block; text-align: center; padding: 20px;\">\n    <div style=\"font-family: 'B Titr', 'Vazirmatn', Tahoma, sans-serif; font-size: 2.2rem; font-weight: bold; color: #f8fafc;\">\n        سناریوی <span style=\"color: #3b82f6; font-size: 2.6rem; margin: 0 8px;\">{{ round_num }}<\/span> از {{ total_rounds }}\n    <\/div>\n    <div style=\"font-size: 1.05rem; color: #94a3b8; margin-top: 5px;\">\n        برخی شرایط تغییر کرده‌اند؛ لطفاً با دقت مقایسه کنید.\n    <\/div>\n<\/div>\n{% endif %}\n\n<div class=\"scroll-hint\">\n    <i class=\"fas fa-mobile-alt\" style=\"margin-left: 6px;\"><\/i>\n    📱🔄 اگر با گوشی وارد شده‌اید، برای دیدن کامل جدول، گوشی را به‌صورت افقی بچرخانید\n<\/div>\n\n<div class=\"compare-wrap\">\n    <table class=\"compare-table\">\n        <thead>\n            <tr>\n                <th class=\"row-label\"><\/th>\n                <th class=\"opt-head\" data-col=\"1\" tabindex=\"0\" onclick=\"chooseColumn(1)\">\n                    <i class=\"fas {{ current_mode_icon }}\"><\/i>\n                    <div class=\"opt-title\">روش فعلی شما<\/div>\n                <\/th>\n                <th class=\"opt-head\" data-col=\"2\" tabindex=\"0\" onclick=\"chooseColumn(2)\">\n                    <i class=\"fas fa-bicycle\"><\/i>\n                    <div class=\"opt-title\">دوچرخه برقی شخصی<\/div>\n                <\/th>\n                <th class=\"opt-head\" data-col=\"3\" tabindex=\"0\" onclick=\"chooseColumn(3)\">\n                    <i class=\"fas fa-bicycle\"><\/i>\n                    <div class=\"opt-title\">دوچرخه برقی اشتراکی<\/div>\n                <\/th>\n            <\/tr>\n        <\/thead>\n        <tbody>\n            <\!-- ردیف ۰: زمان کل سفر -->\n            <tr>\n                <td class=\"row-label\">زمان کل سفر<\/td>\n                <td data-col=\"1\" onclick=\"chooseColumn(1)\">\n                    <span class=\"highlight-value\">{{ current_total_time }} دقیقه<\/span>\n                <\/td>\n                <td data-col=\"2\" onclick=\"chooseColumn(2)\">\n                    <span class=\"highlight-value\">{{ personal_total_time }} دقیقه<\/span>\n                <\/td>\n                <td data-col=\"3\" onclick=\"chooseColumn(3)\">\n                    <span class=\"highlight-value\">{{ shared_total_time }} دقیقه<\/span>\n                <\/td>\n            <\/tr>\n            <\!-- ردیف ۱: پرداخت پیش از استفاده -->\n            <tr>\n                <td class=\"row-label\">پرداخت پیش از استفاده<\/td>\n                <td data-col=\"1\" onclick=\"chooseColumn(1)\">\n                    <span>ندارد<\/span>\n                <\/td>\n                <td data-col=\"2\" onclick=\"chooseColumn(2)\">\n                    <span class=\"highlight-value\">{{ personal_price_display }}<\/span>\n                    {% if personal_subsidy > 0 %}\n                    <span class=\"detail-line\" style=\"color: #34d399;\"><i class=\"fas fa-gift ms-1\"><\/i> (با احتساب {{ personal_support_detail }})<\/span>\n                    {% else %}\n                    <span class=\"detail-line\" style=\"color: #94a3b8;\">{{ personal_support_detail }}<\/span>\n                    {% endif %}\n                <\/td>\n                <td data-col=\"3\" onclick=\"chooseColumn(3)\">\n                    <span class=\"highlight-value\">{{ deposit_display }}<\/span>\n                    <span class=\"deposit-note\">بازگشت‌پذیر؛ هزینه سفر نیست<\/span>\n                <\/td>\n            <\/tr>\n            <\!-- ردیف ۲: هزینه همین سفر -->\n            <tr>\n                <td class=\"row-label\">هزینه همین سفر<\/td>\n                <td data-col=\"1\" onclick=\"chooseColumn(1)\">\n                    <span class=\"highlight-value\">{{ current_cost_display }}<\/span>\n                <\/td>\n                <td data-col=\"2\" onclick=\"chooseColumn(2)\">\n                    <span class=\"highlight-value\" style=\"color: #cbd5e1;\">کرایه ندارد<\/span>\n                    <span class=\"detail-line\">برق و سرویس ثابت<\/span>\n                <\/td>\n                <td data-col=\"3\" onclick=\"chooseColumn(3)\">\n                    <span class=\"highlight-value\">{{ shared_fare_display }}<\/span>\n                <\/td>\n            <\/tr>\n            <\!-- ردیف ۳: مسیر ویژه دوچرخه -->\n            <tr>\n                <td class=\"row-label\">مسیر حفاظت‌شده<\/td>\n                <td data-col=\"1\" onclick=\"chooseColumn(1)\">\n                    <span>وضعیت فعلی مسیر شما<\/span>\n                <\/td>\n                <td data-col=\"2\" onclick=\"chooseColumn(2)\">\n                    {% if protected_km == 0 %}\n                        <span class=\"highlight-value\">مسیر ویژه دوچرخه‌سواری ندارد<\/span>\n                    {% else %}\n                        <span class=\"highlight-value\">{{ protected_km_display }} کیلومتر <\/span>\n                        <span class=\"detail-line\">{{ protected_route_detail|safe }}<\/span>\n                    {% endif %}\n                <\/td>\n                <td data-col=\"3\" onclick=\"chooseColumn(3)\">\n                    {% if protected_km == 0 %}\n                        <span class=\"highlight-value\">مسیر ویژه دوچرخه‌سواری ندارد<\/span>\n                    {% else %}\n                        <span class=\"highlight-value\">{{ protected_km_display }} کیلومتر <\/span>\n                        <span class=\"detail-line\">{{ protected_route_detail|safe }}<\/span>\n                    {% endif %}\n                <\/td>\n            <\/tr>\n            <\!-- ردیف ۴: پارک/تحویل -->\n            <tr>\n                <td class=\"row-label\">پارک / تحویل<\/td>\n                <td data-col=\"1\" onclick=\"chooseColumn(1)\">\n                    <span>شرایط فعلی شما<\/span>\n                <\/td>\n                <td data-col=\"2\" onclick=\"chooseColumn(2)\">\n                    <span>{{ sp_text|safe }}<\/span>\n                <\/td>\n                <td data-col=\"3\" onclick=\"chooseColumn(3)\">\n                    <span>{{ dr_text|safe }}<\/span>\n                <\/td>\n            <\/tr>\n        <\/tbody>\n        <tfoot>\n            <tr>\n                <td class=\"row-label\"><\/td>\n                <td data-col=\"1\">\n                    <label class=\"select-pill\">\n                        <input type=\"radio\" name=\"choice\" value=\"current\" id=\"radio_1\" required>\n                        <span class=\"custom-radio\"><\/span> ادامه روش فعلی\n                    <\/label>\n                <\/td>\n                <td data-col=\"2\">\n                    <label class=\"select-pill\">\n                        <input type=\"radio\" name=\"choice\" value=\"personal\" id=\"radio_2\">\n                        <span class=\"custom-radio\"><\/span> دوچرخه برقی شخصی\n                    <\/label>\n                <\/td>\n                <td data-col=\"3\">\n                    <label class=\"select-pill\">\n                        <input type=\"radio\" name=\"choice\" value=\"shared\" id=\"radio_3\">\n                        <span class=\"custom-radio\"><\/span> دوچرخه برقی اشتراکی\n                    <\/label>\n                <\/td>\n            <\/tr>\n        <\/tfoot>\n    <\/table>\n<\/div>\n\n<button class=\"btn-submit\" id=\"submit-btn\" type=\"submit\">ثبت انتخاب و ادامه <i class=\"fas fa-arrow-left ms-2\"><\/i><\/button>\n\n");</script>
<script>SurveyApp.afterBody();</script>
<script src="assets/bootstrap5/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll('input[name="choice"]').forEach(function(r){
            r.addEventListener('change', syncSelection);
        });
        applyPersianDigits(document.body);
    });

    function applyPersianDigits(root) {
        if (!root) return;
        const persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        const textNodes = [];
        let node;
        while ((node = walker.nextNode())) {
            if (node.nodeValue && /\d/.test(node.nodeValue) && node.parentElement && !['SCRIPT','STYLE','TEXTAREA','INPUT','SELECT'].includes(node.parentElement.tagName)) {
                textNodes.push(node);
            }
        }
        textNodes.forEach(function(textNode) {
            textNode.nodeValue = textNode.nodeValue.replace(/\d/g, function(d) {
                return persianDigits[parseInt(d, 10)];
            });
        });
    }

    function chooseColumn(num) {
        var radio = document.getElementById('radio_' + num);
        if (radio) {
            radio.checked = true;
            radio.dispatchEvent(new Event('change', { bubbles: true }));
        }
    }

    function syncSelection() {
        var checked = document.querySelector('input[name="choice"]:checked');
        var val = checked ? checked.value : null;
        // Map value to column number
        var colMap = {'current': '1', 'personal': '2', 'shared': '3'};
        var colNum = val ? colMap[val] : null;
        
        document.querySelectorAll('[data-col]').forEach(function(el){
            el.classList.toggle('col-selected', colNum !== null && el.dataset.col === colNum);
        });
        
        var btn = document.getElementById('submit-btn');
        if (btn) btn.classList.toggle('active', !!val);
    }
</script>
</body>
</html>
