    <script>SurveyApp.head("\n<link rel=\"stylesheet\" href=\"assets/vazirmatn/Vazirmatn-font-face.css\">\n<link rel=\"stylesheet\" href=\"assets/fontawesome/css/all.min.css\">\n\n<style>\n    body {\n        font-family: 'B Nazanin', 'Vazirmatn', Tahoma, sans-serif !important;\n        background-color: #0f172a;\n        direction: rtl;\n        text-align: right;\n        color: #cbd5e1;\n        font-size: 1.15rem;\n        line-height: 1.9;\n    }\n\n    h1, h2, h3, h4, h5, h6, .progress-text, .col-form-label, .form-label {\n        font-family: 'B Titr', 'Vazirmatn', Tahoma, sans-serif !important;\n        font-weight: bold;\n        color: #f8fafc !important;\n    }\n\n    .otree-body {\n        max-width: 800px;\n        margin: 0 auto;\n    }\n\n    .page-header-default {\n        display: none;\n    }\n\n    .progress-wrapper {\n        margin-top: 15px;\n        margin-bottom: 25px;\n        text-align: left;\n    }\n    .progress-text {\n        font-size: 1.1rem;\n        color: #94a3b8 !important;\n        margin-bottom: 8px;\n        display: inline-block;\n    }\n    .progress-container {\n        width: 100%;\n        background-color: #1e293b;\n        border-radius: 10px;\n        height: 8px;\n        overflow: hidden;\n        box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);\n    }\n    .progress-bar-fill {\n        height: 100%;\n        background: linear-gradient(90deg, #3b82f6, #0ea5e9);\n        width: 20%;\n        border-radius: 10px;\n        transition: width 0.5s ease;\n        box-shadow: 0 0 10px rgba(14, 165, 233, 0.5);\n    }\n\n    .custom-header {\n        background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);\n        color: #f8fafc;\n        border-radius: 16px;\n        padding: 30px;\n        margin-bottom: 30px;\n        box-shadow: 0 8px 25px rgba(0,0,0,0.5);\n        border: 1px solid #334155;\n        position: relative;\n        overflow: hidden;\n    }\n    \n    .custom-header::before {\n        content: '';\n        position: absolute;\n        top: -50px;\n        left: -50px;\n        width: 200px;\n        height: 200px;\n        background: rgba(59, 130, 246, 0.15);\n        border-radius: 50%;\n        filter: blur(50px);\n    }\n\n    .custom-header h4 {\n        margin: 0;\n        font-size: 1.7rem;\n        color: #60a5fa !important;\n        position: relative;\n        z-index: 2;\n    }\n\n    .intro-box {\n        position: relative;\n        z-index: 2;\n        background-color: rgba(30, 41, 59, 0.6);\n        border: 1px solid rgba(59, 130, 246, 0.3);\n        border-right: 4px solid #3b82f6;\n        padding: 25px;\n        border-radius: 12px;\n        backdrop-filter: blur(10px);\n        margin-top: 20px;\n        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);\n    }\n\n    .example-box {\n        background: linear-gradient(90deg, rgba(245, 158, 11, 0.1) 0%, rgba(30, 41, 59, 0) 100%);\n        padding: 15px 20px;\n        border-radius: 8px;\n        border-right: 3px solid #f59e0b;\n        margin-top: 20px;\n    }\n\n    .form-card {\n        background: #1e293b;\n        border: 1px solid #334155;\n        border-radius: 16px;\n        padding: 35px 30px;\n        margin-bottom: 25px;\n        box-shadow: 0 8px 20px rgba(0,0,0,0.4);\n    }\n\n    .form-group {\n        margin-bottom: 0;\n    }\n    \n    .col-form-label {\n        font-size: 1.15rem;\n        margin-bottom: 10px;\n        display: block;\n    }\n\n    .hint-text {\n        font-family: 'B Nazanin', 'Vazirmatn', sans-serif !important;\n        font-weight: normal !important;\n        font-size: 0.95rem;\n        color: #94a3b8;\n    }\n\n    .field-with-unit {\n        display: flex;\n        align-items: center;\n        gap: 15px;\n        flex-wrap: wrap;\n        margin-top: 12px;\n    }\n\n    .field-with-unit input,\n    .field-with-unit select {\n        flex: 1;\n        min-width: 150px;\n    }\n\n    .unit-label {\n        color: #e2e8f0; \n        font-size: 1.15rem; \n        font-family: 'B Titr', 'Vazirmatn', Tahoma, sans-serif !important; \n        min-width: 60px;\n        font-weight: bold;\n        text-align: right;\n    }\n\n    .form-control, .form-select {\n        background-color: #0f172a !important;\n        color: #f8fafc !important;\n        border: 1px solid #475569 !important;\n        border-radius: 10px !important;\n        padding: 12px 15px !important;\n        font-family: 'Vazirmatn', sans-serif !important;\n        font-size: 1.05rem;\n        transition: all 0.3s ease;\n        width: 100%;\n        max-width: 400px;\n    }\n\n    .form-control:focus, .form-select:focus {\n        border-color: #3b82f6 !important;\n        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;\n        outline: none !important;\n    }\n\n    .form-check {\n        margin-bottom: 12px;\n        padding-right: 1.8rem;\n    }\n    \n    .form-check-label {\n        color: #cbd5e1 !important;\n        font-size: 1.15rem;\n        cursor: pointer;\n    }\n\n    .form-check-input {\n        cursor: pointer;\n        width: 1.3em;\n        height: 1.3em;\n        float: right;\n        margin-right: -1.8rem;\n    }\n\n    .checkbox-group .form-check {\n        margin-bottom: 10px;\n    }\n\n    #other-mode-box {\n        display: none;\n        background-color: rgba(59, 130, 246, 0.05);\n        border-right: 3px solid #3b82f6;\n        padding: 20px;\n        border-radius: 8px;\n        margin-top: 20px;\n    }\n\n    .btn-next {\n        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);\n        color: white;\n        border: none;\n        border-radius: 50px;\n        padding: 12px 40px;\n        font-size: 1.3rem;\n        font-family: 'Vazirmatn', sans-serif;\n        font-weight: bold;\n        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);\n        transition: all 0.3s ease;\n        float: left;\n        cursor: pointer;\n        margin-top: 10px;\n        margin-bottom: 40px;\n    }\n\n    .btn-next:hover {\n        background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);\n        transform: translateY(-2px);\n        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.6);\n        color: white;\n    }\n\n    .days-grid {\n        display: flex;\n        flex-wrap: wrap;\n        gap: 10px;\n        margin-top: 10px;\n    }\n    .day-btn {\n        width: 50px;\n        height: 50px;\n        border-radius: 12px;\n        border: 2px solid #475569;\n        background-color: #0f172a;\n        color: #cbd5e1;\n        font-size: 1.2rem;\n        cursor: pointer;\n        transition: all 0.3s ease;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        font-family: 'Vazirmatn', sans-serif;\n    }\n    .day-btn:hover {\n        border-color: #3b82f6;\n        background-color: rgba(59, 130, 246, 0.1);\n    }\n    .day-btn.selected {\n        background-color: #3b82f6;\n        border-color: #3b82f6;\n        color: white;\n        box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);\n    }\n\n    @media (max-width: 768px) {\n        .custom-header { padding: 25px 20px; }\n        .intro-box { padding: 15px; }\n        .form-card { padding: 20px; }\n        .btn-next { width: 100%; float: none; text-align: center; }\n        .form-control { max-width: 100%; }\n        .day-btn { width: 42px; height: 42px; font-size: 1rem; }\n    }\n<\/style>\n");</script>

<script>SurveyApp.body("\n\n<div class=\"progress-wrapper\">\n    <span class=\"progress-text\">اطلاعات سفر مرجع<\/span>\n    <div class=\"progress-container\">\n        <div class=\"progress-bar-fill\"><\/div>\n    <\/div>\n<\/div>\n\n<div class=\"custom-header\">\n    <h4><i class=\"fas fa-route me-2\"><\/i> سفر مرجع شما<\/h4>\n    \n    <div class=\"intro-box\">\n        <p class=\"mb-0\" style=\"color: #e2e8f0; font-size: 1.15rem; text-align: justify; line-height: 2;\">\n            منظور از <strong style=\"color: #60a5fa;\">سفر مرجع<\/strong>، سفری است که در طول هفته بیشتر از هر سفر دیگری انجام می‌دهید و بخش اصلی رفت‌وآمدهای روزمره شما را تشکیل می‌دهد، تمام سؤال‌های بعدی فقط درباره همین سفر است و لطفاً تا پایان پرسشنامه <strong style=\"color: #f8fafc;\">این سفر<\/strong> را در ذهن داشته باشید.\n        <\/p>\n        \n        <div class=\"example-box\">\n            <p class=\"mb-0\" style=\"color: #cbd5e1; font-size: 1.05rem; text-align: justify; line-height: 1.8;\">\n                <i class=\"fas fa-lightbulb me-2\" style=\"color: #f59e0b; font-size: 1.2rem;\"><\/i>\n                <strong style=\"color: #fbbf24;\">به عنوان مثال:<\/strong> سفری که یک فرد هر روز به محل کار خود انجام می‌دهد، یا سفری که یک دانشجو چندین بار در هفته به دانشگاه می‌رود، نسبت به سایر رفت‌وآمدها (مثل سفرهای تفریحی یا خرید) تکرار بسیار بیشتری دارند و بهترین گزینه برای انتخاب هستند.\n            <\/p>\n        <\/div>\n    <\/div>\n<\/div>\n\n<div class=\"form-card\" style=\"border-right: 4px solid #a855f7;\">\n    <div class=\"mb-3\">\n        <label class=\"col-form-label\">\n            در این سفر، اکثراً با کدام روش مسیر را طی می‌کنید؟\n        <\/label>\n        <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_current_mode\"><\/label>\n        <div class=\"controls\">\n            <div id=\"id_current_mode\" required=\"\"><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_current_mode-0\" name=\"current_mode\" required=\"\" value=\"1\"> <label for=\"id_current_mode-0\">پیاده‌روی<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_current_mode-1\" name=\"current_mode\" required=\"\" value=\"2\"> <label for=\"id_current_mode-1\">دوچرخه معمولی<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_current_mode-2\" name=\"current_mode\" required=\"\" value=\"3\"> <label for=\"id_current_mode-2\">موتورسیکلت<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_current_mode-3\" name=\"current_mode\" required=\"\" value=\"4\"> <label for=\"id_current_mode-3\">خودروی شخصی ـ به عنوان راننده<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_current_mode-4\" name=\"current_mode\" required=\"\" value=\"5\"> <label for=\"id_current_mode-4\">خودروی شخصی ـ به عنوان سرنشین<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_current_mode-5\" name=\"current_mode\" required=\"\" value=\"6\"> <label for=\"id_current_mode-5\">تاکسی یا تاکسی اینترنتی<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_current_mode-6\" name=\"current_mode\" required=\"\" value=\"7\"> <label for=\"id_current_mode-6\">اتوبوس یا BRT<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_current_mode-7\" name=\"current_mode\" required=\"\" value=\"8\"> <label for=\"id_current_mode-7\">مترو یا قطار شهری<\/label><\/div><div class=\"form-check\"><input class=\"form-check-input\" type=\"radio\" id=\"id_current_mode-8\" name=\"current_mode\" required=\"\" value=\"9\"> <label for=\"id_current_mode-8\">روش دیگر<\/label><\/div><\/div>\n        <\/div>\n    \n    \n    \n<\/div>\n    <\/div>\n    \n    <div id=\"other-mode-box\">\n        <label class=\"col-form-label\">لطفاً روش دیگر را مشخص کنید:<\/label>\n        <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_current_mode_other\"><\/label>\n        <div class=\"controls\">\n            <input type=\"text\" class=\"form-control\" id=\"id_current_mode_other\" name=\"current_mode_other\" value=\"\">\n        <\/div>\n    \n    \n    \n<\/div>\n    <\/div>\n<\/div>\n\n<div class=\"form-card\" style=\"border-right: 4px solid #3b82f6;\">\n    <div class=\"mb-3\">\n        <label class=\"col-form-label\">\n            این سفر را معمولاً چند روز در هفته انجام می‌دهید؟\n        <\/label>\n        <div style=\"display: flex; align-items: center; gap: 15px;\">\n            <div class=\"days-grid\">\n                {% for i in \"1234567\" %}\n                <div class=\"day-btn\" data-value=\"{{ forloop.counter }}\" onclick=\"selectDay(this)\">{{ forloop.counter }}<\/div>\n                {% endfor %}\n            <\/div>\n            <span class=\"unit-label\">روز<\/span>\n        <\/div>\n        <input type=\"hidden\" name=\"days_per_week\" id=\"days_per_week\" value=\"\">\n    <\/div>\n<\/div>\n\n<div class=\"form-card\" style=\"border-right: 4px solid #10b981;\">\n    <div class=\"mb-3\">\n        <label class=\"col-form-label\">\n            فاصله یک‌طرفه این سفر تقریباً چند کیلومتر است؟\n        <\/label>\n        <span class=\"hint-text\">لطفاً فاصله تقریبی رفت، از مبدأ تا مقصد، را وارد کنید. می‌توانید از عدد اعشاری مانند 5.5 استفاده کنید.<\/span>\n        <div class=\"field-with-unit\">\n            <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_distance_km\"><\/label>\n        <div class=\"controls\">\n            <input type=\"text\" class=\"form-control\" inputmode=\"decimal\" id=\"id_distance_km\" min=\"0.1\" name=\"distance_km\" required=\"\" value=\"\">\n        <\/div>\n    \n    \n    \n<\/div>\n            <span class=\"unit-label\">کیلومتر<\/span>\n        <\/div>\n    <\/div>\n<\/div>\n\n<div class=\"form-card\" style=\"border-right: 4px solid #f59e0b;\">\n    <div class=\"mb-3\">\n        <label class=\"col-form-label\">\n            بخش اصلی حرکت در این سفر معمولاً چند دقیقه طول می‌کشد؟\n        <\/label>\n        <span class=\"hint-text\">فقط زمان حرکت با وسیله اصلی یا پیاده‌روی اصلی را وارد کنید. زمان انتظار، دسترسی، جست‌وجوی محل پارک و پیاده‌روی پس از پارک را در این سؤال حساب نکنید.<\/span>\n        <div class=\"field-with-unit\">\n            <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_main_time_min\"><\/label>\n        <div class=\"controls\">\n            <input type=\"number\" class=\"form-control\" inputmode=\"numeric\" id=\"id_main_time_min\" min=\"1\" name=\"main_time_min\" required=\"\" value=\"\">\n        <\/div>\n    \n    \n    \n<\/div>\n            <span class=\"unit-label\">دقیقه<\/span>\n        <\/div>\n    <\/div>\n<\/div>\n\n<div class=\"form-card\" style=\"border-right: 4px solid #ef4444;\">\n    <div class=\"mb-3\">\n        <label class=\"col-form-label\">\n            انتظار، دسترسی، جست‌وجوی محل پارک و پیاده‌روی ابتدا و انتهای این سفر، روی‌هم چند دقیقه طول می‌کشد؟\n        <\/label>\n        <span class=\"hint-text\">اگر این سفر چنین زمانی ندارد، عدد صفر را وارد کنید.<\/span>\n        <div class=\"field-with-unit\">\n            <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_access_time_min\"><\/label>\n        <div class=\"controls\">\n            <input type=\"number\" class=\"form-control\" inputmode=\"numeric\" id=\"id_access_time_min\" min=\"0\" name=\"access_time_min\" required=\"\" value=\"\">\n        <\/div>\n    \n    \n    \n<\/div>\n            <span class=\"unit-label\">دقیقه<\/span>\n        <\/div>\n    <\/div>\n<\/div>\n\n<div class=\"form-card\" style=\"border-right: 4px solid #ec4899;\">\n    <div class=\"mb-3\">\n        <label class=\"col-form-label\">\n            هزینه مستقیم یک سفر یک‌طرفه با روش فعلی شما تقریباً چقدر است؟\n        <\/label>\n        <span class=\"hint-text\">هزینه‌هایی مانند سوخت، کرایه، عوارض، طرح ترافیکی و هزینه پارک را در نظر بگیرید. اگر این سفر هزینه مستقیم ندارد، عدد صفر را وارد کنید.<\/span>\n        <div class=\"field-with-unit\">\n            <div class=\"mb-3 _formfield\">\n    \n        <label class=\"col-form-label\" for=\"id_current_cost_toman\"><\/label>\n        <div class=\"controls\">\n            <input type=\"number\" class=\"form-control\" inputmode=\"numeric\" id=\"id_current_cost_toman\" min=\"0\" name=\"current_cost_toman\" required=\"\" value=\"\">\n        <\/div>\n    \n    \n    \n<\/div>\n            <span class=\"unit-label\">هزار تومان<\/span>\n        <\/div>\n    <\/div>\n<\/div>\n\n<div class=\"form-card\" style=\"border-right: 4px solid #06b6d4;\">\n    <div class=\"mb-3\">\n        <label class=\"col-form-label\">\n            کدام‌یک از موارد زیر اکنون در دسترس شماست؟ می‌توانید بیش از یک گزینه را انتخاب کنید.\n        <\/label>\n        <div class=\"checkbox-group\">\n            <div class=\"form-check\">\n                <input class=\"form-check-input\" type=\"checkbox\" name=\"access_car\" id=\"access_car\" value=\"1\">\n                <label class=\"form-check-label\" for=\"access_car\">خودرو شخصی قابل استفاده<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input\" type=\"checkbox\" name=\"existing_ebike\" id=\"existing_ebike\" value=\"1\">\n                <label class=\"form-check-label\" for=\"existing_ebike\">دوچرخه برقی شخصی<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input\" type=\"checkbox\" name=\"digital_access\" id=\"digital_access\" value=\"1\">\n                <label class=\"form-check-label\" for=\"digital_access\">گوشی هوشمند و امکان پرداخت آنلاین<\/label>\n            <\/div>\n            <div class=\"form-check\">\n                <input class=\"form-check-input\" type=\"checkbox\" name=\"none_available\" id=\"none_available\" value=\"1\">\n                <label class=\"form-check-label\" for=\"none_available\">هیچ‌کدام<\/label>\n            <\/div>\n        <\/div>\n    <\/div>\n<\/div>\n\n<button class=\"btn-next\" type=\"submit\">ادامه <i class=\"fas fa-arrow-left ms-2\" style=\"position: relative; top: 2px;\"><\/i><\/button>\n\n");</script>
<script>SurveyApp.afterBody();</script>
<script src="assets/bootstrap5/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // مدیریت انتخاب روز
        window.selectDay = function(btn) {
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('days_per_week').value = btn.getAttribute('data-value');
        };

        // مدیریت نمایش کادر "روش دیگر"
        const modeRadios = document.querySelectorAll('input[name="current_mode"]');
        const otherBox = document.getElementById('other-mode-box');
        
        function checkOtherMode() {
            let isOther = false;
            modeRadios.forEach(radio => {
                if (radio.checked && radio.value === "9") {
                    isOther = true;
                }
            });
            if (otherBox) {
                otherBox.style.display = isOther ? 'block' : 'none';
            }
            const otherInput = document.querySelector('input[name="current_mode_other"]');
            if (otherInput) {
                otherInput.required = isOther;
            }
        }
        
        modeRadios.forEach(radio => radio.addEventListener('change', checkOtherMode));
        checkOtherMode();

        // مدیریت انحصاری بودن "هیچ‌کدام" در Q7
        const noneCheck = document.getElementById('none_available');
        const otherChecks = ['access_car', 'existing_ebike', 'digital_access'];
        
        if (noneCheck) {
            noneCheck.addEventListener('change', function() {
                if (this.checked) {
                    otherChecks.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.checked = false;
                    });
                }
            });
        }
        
        otherChecks.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('change', function() {
                    if (this.checked && noneCheck) {
                        noneCheck.checked = false;
                    }
                });
            }
        });
    });
</script>
</body>
</html>
