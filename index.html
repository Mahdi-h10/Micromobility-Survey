ransparent;\n        background-clip: text;\n    }\n\n    .welcome-content {\n        background: rgba(15, 23, 42, 0.5);\n        border-right: 4px solid #3b82f6; /* راست‌چین کردن خط کناری برای زبان فارسی */\n        border-radius: 12px;\n        padding: 25px 20px;\n        margin-bottom: 35px;\n        text-align: right;\n    }\n\n    .welcome-content p {\n        margin: 14px 0;\n        color: #cbd5e1;\n        line-height: 2;\n        font-size: 1.05rem;\n    }\n\n    .welcome-content p:first-child {\n        margin-top: 0;\n    }\n\n    .welcome-content p strong {\n        color: #fbbf24;\n        font-weight: 600;\n    }\n\n    .btn-continue {\n        background: linear-gradient(135deg, #3b82f6, #2563eb);\n        color: white;\n        border: none;\n        border-radius: 50px;\n        padding: 15px 45px;\n        font-size: 1.25rem;\n        font-family: 'B Titr', 'Vazirmatn', Tahoma, sans-serif !important;\n        font-weight: bold;\n        cursor: pointer;\n        box-shadow: 0 12px 30px rgba(59, 130, 246, 0.4);\n        transition: all 0.3s ease;\n        display: inline-block;\n        margin-top: 10px;\n        width: 100%; /* دکمه هم‌عرض باکس شود */\n    }\n\n    .btn-continue:hover {\n        background: linear-gradient(135deg, #60a5fa, #3b82f6);\n        transform: translateY(-3px);\n        box-shadow: 0 15px 40px rgba(59, 130, 246, 0.6);\n        color: white;\n    }\n\n    .btn-continue:active {\n        transform: translateY(-1px);\n    }\n\n    @media (max-width: 600px) {\n        .otree-body {\n            margin: 2vh auto;\n        }\n\n        .welcome-container {\n            padding: 35px 25px;\n            border-radius: 20px;\n        }\n\n        .welcome-title {\n            font-size: 1.8rem;\n        }\n\n        .welcome-icon {\n            font-size: 3.5rem;\n        }\n\n        .btn-continue {\n            padding: 14px 35px;\n            font-size: 1.15rem;\n        }\n    }\n<\/style>\n");</script>

<script>SurveyApp.body("\n\n<div class=\"welcome-container\">\n    <i class=\"fas fa-bicycle welcome-icon\"><\/i>\n    \n    <h2 class=\"welcome-title\">\n        به پرسشنامه «دوچرخه برقی» خوش آمدید\n    <\/h2>\n\n    <div class=\"welcome-content\">\n        <p>این پژوهش درباره <strong>رفت‌وآمد معمول شما<\/strong> است و تکمیل آن معمولاً حدود <strong>۸ دقیقه<\/strong> زمان می‌برد.<\/p>\n        \n        <p><strong>پاسخ درست یا مطلوبی وجود ندارد.<\/strong><\/p>\n        \n        <p>اطلاعات شما <strong>بدون نام<\/strong> و فقط به‌صورت <strong>آماری و گروهی<\/strong> تحلیل می‌شود.<\/p>\n        \n        <p>شرکت در این پژوهش <strong>کاملاً داوطلبانه<\/strong> است و هر زمان بخواهید می‌توانید منصرف شوید.<\/p>\n    <\/div>\n\n    <button class=\"btn-continue\" type=\"submit\">\n        ادامه دادن\n        <i class=\"fas fa-arrow-left ms-2\" style=\"margin-right: 8px; position: relative; top: 2px;\"><\/i>\n    <\/button>\n<\/div>\n\n");</script>
